# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   check MANIFEST.json provenance -> build the portable EXE and the signed APK ->
#   publish the rolling `app-latest` release -> deploy the demo to Pages. All
#   three come from the same commit, so the live demo and the released build can
#   never disagree. The manifest gate runs first and stops the build when a
#   recorded blob no longer matches the commit.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  manifest:
    # MANIFEST.json records a blob sha per file. Commits and generators kept
    # forgetting to re-record it, and the protected classes hid the drift, so
    # every release is gated on the manifest matching the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MANIFEST.json matches the checkout
        run: python3 tools/manifest-gate.py
      - name: MANIFEST.json refuses to drift
        # The gate and manifest.py's refusals, driven in throwaway repos: a
        # record or claim that stops refusing split provenance, a lock or a
        # protected class fails here on every push instead of in a generator.
        run: python3 tools/test-manifest.py

  app:
    needs: manifest
    uses: drsamonline/app-builder/.github/workflows/build.yml@f181238a709f3b124dbf30e1f7c6835ccbe6321f   # was @main
    with:
      app_name: dance-fight
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job dispatches the run that publishes its picture
      id-token: write
