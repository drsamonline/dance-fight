<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — off beat | Dance Fight</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#ec4899" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ec4899'/%3E%3Crect x='7' y='14' width='4' height='12' rx='2' fill='%23fff'/%3E%3Crect x='14' y='7' width='4' height='19' rx='2' fill='%23fff'/%3E%3Crect x='21' y='11' width='4' height='15' rx='2' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;color:#f7f2ff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1000px 700px at 15% -10%,rgba(236,72,153,.42),transparent 60%),
      radial-gradient(900px 640px at 85% 6%,rgba(124,58,237,.46),transparent 60%),
      linear-gradient(160deg,#0b0416,#150726 48%,#0a0314)}
  .card{max-width:560px}
  h1{font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;text-transform:uppercase;font-size:clamp(56px,16vw,120px);line-height:.9;margin:0 0 8px;
    background:linear-gradient(92deg,#fff,#ffc9ec 40%,#ec4899 80%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:clamp(20px,5vw,32px);margin:0 0 10px;color:#22d3ee}
  p{color:#c7b8e6;font-size:16px;margin:0 0 24px}
  .eq{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:70px;margin:0 0 22px}
  .eq span{width:9px;border-radius:5px;background:linear-gradient(180deg,#22d3ee,#ec4899);height:35%}
  @keyframes eq{0%,100%{height:22%}50%{height:100%}}
  .eq span{animation:eq 1s ease-in-out infinite}
  .eq span:nth-child(1){animation-delay:-.85s}.eq span:nth-child(2){animation-delay:-.4s}
  .eq span:nth-child(3){animation-delay:-.65s}.eq span:nth-child(4){animation-delay:-.15s}
  .eq span:nth-child(5){animation-delay:-.5s}.eq span:nth-child(6){animation-delay:-.9s}
  .eq span:nth-child(7){animation-delay:-.3s}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:15px;padding:13px 22px;border-radius:999px;color:#fff}
  a.primary{background:linear-gradient(90deg,#ec4899,#7c3aed);box-shadow:0 10px 30px rgba(124,58,237,.45)}
  a.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24)}
  @media (prefers-reduced-motion:reduce){.eq span{animation:none;height:60%}}
</style>
</head>
<body>
  <div class="card">
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <h1>404</h1>
    <h2>You&rsquo;re off beat</h2>
    <p>That page isn&rsquo;t on the grid. Step back to the landing page, or jump straight into the arena and fight to the rhythm.</p>
    <div class="btns">
      <a class="btn primary" href="/dance-fight/play/">Play Dance Fight</a>
      <a class="btn ghost" href="/dance-fight/">Back to landing page</a>
    </div>
  </div>
</body>
</html>
